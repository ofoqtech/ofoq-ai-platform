version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ofoq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ofoq}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-ofoq_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ofoq_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ofoq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ofoq_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [ofoq_net]
    # GPU support (uncomment if VPS has GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: ofoq_gateway
    restart: unless-stopped
    env_file: ./gateway/.env
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks: [ofoq_net]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.gateway.loadbalancer.server.port=3000"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ofoq_dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    networks: [ofoq_net]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.dashboard.loadbalancer.server.port=3001"

  traefik:
    image: traefik:v2.11
    container_name: ofoq_traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [ofoq_net]

volumes:
  postgres_data:
  ollama_data:
  letsencrypt:

networks:
  ofoq_net:
    driver: bridge
